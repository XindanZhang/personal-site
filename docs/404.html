<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f7f7f8">
    <title>Not found | Xindan Zhang</title>
    <link rel="icon" href="/personal-site/favicon.svg" type="image/svg+xml">
    <style>
      @font-face { font-family: "Paper Mono"; src: url("/personal-site/fonts/paper-mono.woff2") format("woff2"); font-style: normal; font-weight: 100 900; font-display: swap; }
      :root { color-scheme: light; --paper: #f7f7f8; --ink: #15171c; --muted: #656b76; --line: #d5d8df; --blue: #1646ff; --signal: #ff633f; }
      * { box-sizing: border-box; letter-spacing: 0; }
      body { min-height: 100vh; margin: 0; background: var(--paper); color: var(--ink); font: 16px/1.6 Arial, "Helvetica Neue", sans-serif; }
      header { display: flex; height: 72px; align-items: center; justify-content: space-between; padding: 0 32px; border-bottom: 1px solid var(--line); }
      header strong { font-size: 16px; }
      header span { font: 12px/1 "Paper Mono", monospace; color: var(--muted); }
      main { display: grid; width: min(calc(100% - 40px), 1180px); min-height: calc(100vh - 72px); margin: auto; align-content: center; padding: 64px 0; }
      .kicker { margin: 0 0 24px; color: var(--blue); font: 12px/1.2 "Paper Mono", monospace; text-transform: uppercase; }
      h1 { max-width: 820px; margin: 0 0 24px; font: 700 82px/0.96 Arial, sans-serif; }
      .message { max-width: 560px; margin: 0 0 36px; color: var(--muted); font-size: 18px; }
      a { display: inline-flex; width: fit-content; min-height: 48px; align-items: center; padding: 0 18px; border: 1px solid var(--ink); border-radius: 4px; background: var(--ink); color: var(--paper); font-size: 14px; font-weight: 700; text-decoration: none; transition: transform 160ms cubic-bezier(.23,1,.32,1); }
      a:active { transform: scale(.97); }
      a:focus-visible { outline: 3px solid var(--blue); outline-offset: 3px; }
      @media (max-width: 640px) { header { height: 64px; padding: 0 20px; } main { min-height: calc(100vh - 64px); } h1 { font-size: 52px; } }
    </style>
  </head>
  <body>
    <header><strong>Personal site</strong><span>404</span></header>
    <main><p class="kicker">Error · 404</p><h1>There is nothing here.</h1><p class="message">The page may have moved, or the address is no longer part of this site.</p><a href="/personal-site/">Return home</a></main>
  </body>
</html>
